name: clawhub-watch

# Daily check of ClawHub skill/plugin stats. Fetches each item's version +
# download count from the ClawHub public JSON API, updates clawhub-versions.json,
# and commits whenever a real value changed (versions OR downloads). A GitHub
# issue is opened only on a VERSION bump — download counts move constantly and
# would spam. The JSON feeds the portfolio's ClawHub cards panel.
on:
  schedule:
    - cron: '23 14 * * *'   # Daily ~14:23 UTC (off the :00 mark)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: clawhub-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check ClawHub stats
        id: check
        # stdout carries version-bump lines only (drives the issue step below);
        # the script also rewrites clawhub-versions.json with new downloads.
        run: |
          changes="$(node scripts/check-clawhub-versions.mjs)"
          {
            echo "changes<<EOF"
            echo "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit refreshed stats
        # Commit on ANY real change (version or downloads). The `-I` ignore makes
        # an `updatedAt`-only diff a no-op, so quiet days don't churn history.
        run: |
          git config user.name  "clawhub-watch"
          git config user.email "clawhub-watch@users.noreply.github.com"
          git add clawhub-versions.json
          if git diff --cached -I '"updatedAt":' --quiet; then
            echo "No meaningful ClawHub changes (timestamp only or no diff)."
          else
            git commit -m "chore(clawhub): refresh $(date -u +%FT%TZ)"
            git push
          fi

      - name: Open issue on version bump
        if: steps.check.outputs.changes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES: ${{ steps.check.outputs.changes }}
        run: |
          printf 'New ClawHub version(s) detected:\n\n%s\n\n— clawhub-watch (daily)\n' "$CHANGES" > /tmp/clawhub-body.md
          gh issue create --title "ClawHub: new version(s) published" --body-file /tmp/clawhub-body.md
